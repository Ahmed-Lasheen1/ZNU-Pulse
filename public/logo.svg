<?xml version="1.0" encoding="UTF-8"?>
<!-- ZNU Pulse logo: ECG path on the site gradient. Square tile; the container rounds it. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="8 0 1024 1024" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a6d2ef"/><stop offset=".15" stop-color="#97bcd7"/>
      <stop offset=".30" stop-color="#81a6c3"/><stop offset=".45" stop-color="#6c8fad"/>
      <stop offset=".60" stop-color="#497194"/><stop offset=".75" stop-color="#274e79"/>
      <stop offset=".90" stop-color="#042a59"/><stop offset="1" stop-color="#010c4a"/>
    </linearGradient>
    <filter id="contactShadow" x="-12%" y="-12%" width="140%" height="145%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5.5" result="softEdge"/>
      <feOffset in="softEdge" dx="8" dy="15" result="offset"/>
      <feColorMatrix in="offset" type="matrix" values="0 0 0 0 0.005 0 0 0 0 0.055 0 0 0 0 0.14 0 0 0 .48 0"/>
    </filter>
    <filter id="ambientShadow" x="-16%" y="-16%" width="150%" height="155%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="wideEdge"/>
      <feOffset in="wideEdge" dx="10" dy="19" result="offset"/>
      <feColorMatrix in="offset" type="matrix" values="0 0 0 0 0.005 0 0 0 0 0.045 0 0 0 0 0.12 0 0 0 .43 0"/>
    </filter>
    <path id="ecg" d="M134 536 H193 C210 536 217 529 228 514 C235 504 240 498 246 498 C253 498 258 509 264 523 C272 542 279 564 294 566 C309 570 316 552 322 532 L342 450 C345 438 349 431 355 431 C361 431 365 442 369 455 L383 507 C386 519 392 524 403 525 C419 525 424 536 428 550 L451 624 L527 191 L607 711 L648 568 C651 559 656 557 664 559 C676 562 685 570 695 563 C706 554 710 531 717 510 C723 489 731 473 741 472 C753 470 761 488 769 505 C776 521 781 532 793 535 C804 538 811 528 821 526 C832 523 843 534 853 536 H909"/>
  </defs>
  <rect x="8" y="0" width="1024" height="1024" fill="url(#bg)"/>
  <use href="#ecg" xlink:href="#ecg" stroke="#02152e" stroke-width="25" stroke-linecap="round" stroke-linejoin="round" filter="url(#ambientShadow)"/>
  <use href="#ecg" xlink:href="#ecg" stroke="#011630" stroke-width="25" stroke-linecap="round" stroke-linejoin="round" filter="url(#contactShadow)"/>
  <use href="#ecg" xlink:href="#ecg" stroke="#ebf9ff" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
