<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ZNU Pulse" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" href="/icon-192.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#a6d2ef" />
    <meta name="description" content="ZNU Pulse — Your integrated medical study platform: schedules, checklists, question banks, lecture files, and smart summaries for ZNU medical students." />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="ZNU Pulse" />
    <meta property="og:description" content="Your integrated medical study platform for ZNU medical students — schedules, checklists, MCQ bank, files, and summaries in one place." />
    <meta property="og:image" content="/icon-512.png" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ZNU Pulse" />
    <meta name="twitter:description" content="Your integrated medical study platform for ZNU medical students." />

    <!-- Sora is now the app's single typeface (display + body) across
         every page and both themes — replaces the previous Plus
         Jakarta Sans + Inter combination used only on the Pulse pages,
         and the plain Segoe UI system font used elsewhere. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- PERF: warms the connection to Supabase before the first API
         call fires (Home's modules/site_settings queries showed up on
         PageSpeed's critical path with a full cold DNS+TLS+TTFB cost).
         Doesn't touch any query, table, or auth behavior — only opens
         the connection earlier. -->
    <link rel="preconnect" href="https://rbgfupgwmgvvrrzuawpo.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://rbgfupgwmgvvrrzuawpo.supabase.co" />

    <!-- PERF: the Sora stylesheet used to block first paint (~750ms
         per PageSpeed's render-blocking-requests audit). Standard
         "loadCSS" pattern: media="print" fetches it at low priority
         without blocking render, then onload flips it to media="all"
         once it lands. Same font, same weights, same display=swap —
         just no longer render-blocking. <noscript> keeps it working
         with JS disabled. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'; this.onload=null;"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    </noscript>

    <title>ZNU Pulse</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
