<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ZNU Pulse" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="icon" type="image/png" href="/icon-192.png?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <link rel="manifest" href="/manifest.json" />
    <!-- One tag only: the app updates it when the color mode changes (a media-query variant would follow the OS instead). -->
    <meta name="theme-color" content="#0B1F3B" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="ZNU Pulse — Your integrated medical study platform: schedules, checklists, question banks, lecture files, and smart summaries for ZNU medical students." />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ZNU Pulse" />
    <meta property="og:url" content="https://znu-pulse.vercel.app/" />
    <meta property="og:title" content="ZNU Pulse" />
    <meta property="og:description" content="Your integrated medical study platform for ZNU medical students — schedules, checklists, MCQ bank, files, and summaries in one place." />
    <meta property="og:image" content="https://znu-pulse.vercel.app/icon-512.png" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ZNU Pulse" />
    <meta name="twitter:description" content="Your integrated medical study platform for ZNU medical students." />
    <meta name="twitter:image" content="https://znu-pulse.vercel.app/icon-512.png" />

    <style>
      /* Critical page background, painted before the app stylesheet loads. Keep in sync with --page-bg in src/styles/index.css. */
      html { background-color: #0B1F3B; }
      html[data-theme='light'] { background-color: #C9DDF2; }
      html, body { margin: 0; }
    </style>

    <script>
      // Applies the saved color mode before first paint so the page never flashes the wrong background.
      // The key and values match znu_theme written by App.jsx; dark is the default.
      (function () {
        var theme = 'dark';
        try {
          if (localStorage.getItem('znu_theme') === 'light') theme = 'light';
        } catch (e) {}
        var root = document.documentElement;
        root.setAttribute('data-theme', theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', getComputedStyle(root).backgroundColor);
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="preconnect" href="https://rbgfupgwmgvvrrzuawpo.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://rbgfupgwmgvvrrzuawpo.supabase.co" />

    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'; this.onload=null;"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    </noscript>

    <title>ZNU Pulse</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
