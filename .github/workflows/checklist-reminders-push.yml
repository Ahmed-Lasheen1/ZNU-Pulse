name: Checklist Deadline Reminders Push

on:
  schedule:
    - cron: '0 * * * *'   # hourly; deadlines are date-only
  workflow_dispatch:

jobs:
  send-checklist-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger checklist reminder check
        run: |
          curl -sS -f --retry 2 --retry-delay 10 -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/push/checklist-reminders"
            