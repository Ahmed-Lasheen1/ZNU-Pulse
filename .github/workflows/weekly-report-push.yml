name: Weekly Report Push

on:
  schedule:
    - cron: '0 18 * * 4'   # Thursdays 18:00 UTC
  workflow_dispatch:

jobs:
  send-weekly-report:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ secrets.SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Check required secrets are set
        run: |
          [ -z "$SITE_URL" ] && echo "❌ Missing repo secret: SITE_URL" && exit 1
          [ -z "$CRON_SECRET" ] && echo "❌ Missing repo secret: CRON_SECRET" && exit 1
          echo "✅ Required secrets are present"

      - name: Trigger weekly report
        run: |
          status=$(curl -sS -o response.txt -w "%{http_code}" --retry 2 --retry-delay 10 -X POST \
            -H "x-cron-secret: $CRON_SECRET" \
            "${SITE_URL%/}/api/push/weekly-report")
          echo "HTTP status: $status"
          echo "Response body:"
          cat response.txt
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "❌ Request failed"
            exit 1
          fi
          