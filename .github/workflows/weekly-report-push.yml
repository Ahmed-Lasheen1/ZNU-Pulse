name: Weekly Report Push

on:
  schedule:
    - cron: '0 18 * * 4'   # Thursdays 18:00 UTC
  workflow_dispatch:

jobs:
  send-weekly-report:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger weekly report
        run: |
          curl -sS -f --retry 2 --retry-delay 10 -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/push/weekly-report"
            